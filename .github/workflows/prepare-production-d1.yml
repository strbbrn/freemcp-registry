name: Prepare Production D1 (manual, no deployment)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREPARE_PRODUCTION_D1 to authorize production database initialization'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: freemcp-production-d1
  cancel-in-progress: false
jobs:
  initialize:
    if: github.ref == 'refs/heads/feature/freemcp-v2-foundation' && inputs.confirmation == 'PREPARE_PRODUCTION_D1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '030baee49692e80fb99fa6f602c846c9'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is required"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Validate registry source
        run: node scripts/validate-server-migration.mjs
      - name: Install Wrangler CLI
        run: npm install --no-save --package-lock=false wrangler@4
      - name: Apply production D1 schema
        run: npm run db:migrate:prod
      - name: Seed production D1 records
        run: npm run db:seed:prod
      - name: Verify production record count
        run: npx wrangler d1 execute freemcp-prod-registry --config wrangler.d1.jsonc --env production --remote --command="SELECT COUNT(*) AS count FROM servers;"
      - name: Confirm scope
        run: echo 'Production D1 initialized. No Pages deployment or main-branch merge was performed.'
