name: Triage MCP submissions
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  triage:
    if: github.event_name == 'issues' && !github.event.issue.pull_request && startsWith(github.event.issue.title, '[MCP Submission]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - name: Validate submission and post preliminary review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-submission-issue.mjs
