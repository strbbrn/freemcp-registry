name: Prepare approved MCP registration
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved MCP submission issue number
        required: true
        type: number
      install_command:
        description: Reviewed executable for stdio MCP (e.g. npx, python, quelllm-mcp); leave blank for remote
        required: false
        type: string
      install_args_json:
        description: JSON array of reviewed executable arguments, e.g. ["-y","package"]
        required: false
        default: '[]'
        type: string
      install_endpoint:
        description: Reviewed HTTPS MCP endpoint; leave blank for stdio
        required: false
        type: string
permissions:
  contents: read
  issues: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate SQL candidate (no database access)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
          INSTALL_ARGS_JSON: ${{ inputs.install_args_json }}
          INSTALL_ENDPOINT: ${{ inputs.install_endpoint }}
        run: node scripts/prepare-approved-registration.mjs
      - name: Upload registration candidate for maintainer review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: registration-candidate-issue-${{ inputs.issue_number }}
          path: |
            registration-candidate.sql
            registration-review.json
          retention-days: 14
          if-no-files-found: error
