name: Evaluate dependency remediation
on:
  push:
    branches:
      - feature/freemcp-v2-foundation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remediation:
    name: Evaluate patched dependency candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install existing lockfile
        run: npm ci
      - name: Apply compatible dependency fixes
        run: npm audit fix || echo 'Some advisories require a major upgrade; continuing candidate evaluation'
      - name: Upgrade Astro to patched major release
        run: npm install astro@7.4.12 --save-exact
      - name: Compile candidate
        id: candidate_build
        continue-on-error: true
        run: npm run build
      - name: Audit candidate dependencies
        if: always()
        run: |
          npm audit --json > audit-candidate.json || true
          npm audit --omit=dev --json > audit-candidate-runtime.json || true
      - name: Preserve candidate dependency files and audit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-remediation-candidate
          path: |
            package.json
            package-lock.json
            audit-candidate.json
            audit-candidate-runtime.json
          retention-days: 14
      - name: Enforce candidate build success
        if: steps.candidate_build.outcome != 'success'
        run: |
          echo 'Candidate build failed; inspect logs before updating dependencies.'
          exit 1
